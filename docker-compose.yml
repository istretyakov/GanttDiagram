# Локальная разработка: `docker compose up -d postgres`.
# Всё приложение целиком: `docker compose --profile app up -d --build` → http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gantt
      POSTGRES_USER: gantt
      POSTGRES_PASSWORD: gantt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gantt -d gantt"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: src/GanttDiagram.Api/Dockerfile
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=gantt;Username=gantt;Password=gantt"
      DataProtection__KeysPath: /app/keys
      # Не проверять SSL-сертификат Jira (внутренний/самоподписанный). Надёжнее — добавить корневой
      # сертификат компании в backend/certs и убрать эту строку.
      JIRA_SSL_VERIFY: "false"
      # Корпоративный прокси для доступа к Jira, если нужен:
      # Jira__Proxy: http://proxy.company.local:3128
    volumes:
      - apikeys:/app/keys
      # Корневой сертификат внутреннего ЦС, если Jira работает по HTTPS с ним:
      # - ./certs/company-root-ca.crt:/usr/local/share/ca-certificates/company-root-ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  apikeys:
